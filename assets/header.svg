<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#00e7ff"/>
      <stop offset="1" stop-color="#7b61ff"/>
    </linearGradient>
    <style>
      .bg { fill:#0b0f1a; }
      .title { font: bold 28px 'Segoe UI', Roboto, sans-serif; fill: url(#g); }
      .subtitle { font: 16px 'Segoe UI', Roboto, sans-serif; fill: #9aa4b2; }
      .typing { fill: #FFFFFF; font: 20px 'Courier New', monospace; }
      .cursor { fill: #00e7ff; }
      @keyframes blink { 50% { opacity: 0; } }
      .cursor { animation: blink 1s steps(2, start) infinite; }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%" rx="12"/>
  <text class="title" x="40" y="42">Vishnu Prakash</text>
  <text class="subtitle" x="40" y="68">Business Data Analyst • AI Engineer • Power BI Developer</text>
  <g transform="translate(40,92)">
    <text class="typing" id="t">Founder @ Infinity Nest Data Analytics —</text>
    <text class="cursor" x="720">|</text>
  </g>
</svg>
